<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tank U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="loading">Loading…</div>
  <div id="crosshair"></div>
  <div id="gun-marker"></div>
  <div id="overlay">
    <div class="overlay-inner">
      <strong class="pause-title">Paused</strong>
      <div>Esc / click to resume — or press any gamepad button</div>
      <div class="overlay-hint">1 smoke · 2 air · 3 repair · 4 ship · hold R · RMB .50 · Shift nitro · Esc pause · C freefly · F focus · F3 debug · V visuals · Space unflip · T reset</div>
      <button type="button" id="pause-resume">Resume</button>
      <button type="button" id="restart-game">Restart</button>
      <button type="button" id="reset-cam">Reset camera</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
