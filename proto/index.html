<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tank U</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="loading">Loading…</div>
  <div id="crosshair"></div>
  <div id="gun-marker"></div>
  <div id="overlay">
    <div class="overlay-inner">
      <div>Click to drive (mouse captures) — or press any gamepad button</div>
      <div class="overlay-hint">Shift nitro · F freefly · F3 debug · V visuals · Space unflip · R reset tank</div>
      <button type="button" id="restart-game">Restart game</button>
      <button type="button" id="reset-cam">Reset camera to defaults</button>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
